name: Verify app and capture UI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt playwright==1.60.0
          python -m playwright install --with-deps chromium
      - name: Test algorithms and Streamlit controls
        run: python -m pytest -q --disable-warnings
      - name: Capture real app screenshots
        run: python capture_ui.py
      - name: Upload screenshots and evidence
        uses: actions/upload-artifact@v4
        with:
          name: pixel-lab-ui-evidence
          path: evidence/
